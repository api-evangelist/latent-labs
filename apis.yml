aid: latent-labs
name: Latent Labs
description: >-
  Latent Labs is a London- and San Francisco-based frontier AI lab founded in
  2023 by Dr. Simon Kohl, a former senior research scientist on DeepMind's
  Nobel Prize-winning AlphaFold 2 and co-lead of DeepMind's protein design
  team. The company builds generative AI foundation models to make biology
  programmable, with the goal of enabling biotech and pharmaceutical partners
  to computationally generate and optimize therapeutic molecules. Latent Labs
  emerged from stealth in February 2025 with $50M in total funding ($40M
  Series A co-led by Radical Ventures and Sofinnova Partners, plus 8VC,
  Kindred Capital, Pillar VC, Flying Fish, Isomer, and angel investors
  including Jeff Dean, Aidan Gomez, and Mati Staniszewski). The company's
  proprietary model family includes Latent-X (atom-level de novo protein
  binder design for macrocycles and mini-binders), Latent-X2 (drug-like
  antibodies with low ex vivo immunogenicity), and Latent-Y (described as
  the first lab-validated agent for drug design). Models are accessed
  through the Latent Labs Platform (platform.latentlabs.com) — a no-code
  web application with a free tier and daily credits — and, for Latent-X2,
  via API for commercial partners. There is no public OpenAPI spec, SDK,
  or open-source release at this time; programmatic access is gated through
  partnerships@latentlabs.com and wet-lab validation is performed in-house
  at the company's San Francisco facility.
